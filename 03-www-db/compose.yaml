services:
  nginx:
    container_name: nginx
    build: ./nginx
    ports:
      - 80:80
    volumes:
      - ./nginx/conf:/etc/nginx
      - ./app:/app
    depends_on:
      - php
  php:
    container_name: php
    build: ./php-fpm
    volumes:
      - ./php-fpm/conf:/etc/php85
      - ./app:/app
    depends_on:
      - mysql
      - pgsql
      - redis
  mysql:
    container_name: db-mysql
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
  pgsql:
    container_name: db-pgsql
    image: postgres
    environment:
      POSTGRES_PASSWORD: secret
  redis:
    container_name: db-redis
    image: redis
